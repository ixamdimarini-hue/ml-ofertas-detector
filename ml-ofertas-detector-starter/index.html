<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ML Ofertas Detector</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#111827;background:#f5f7fb}
    *{box-sizing:border-box}
    body{margin:0}
    .wrap{max-width:1120px;margin:0 auto;padding:32px 18px 60px}
    .hero{background:#ffe600;border-radius:22px;padding:28px;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:34px}
    .hero p{margin:0;color:#374151}
    .search{display:flex;gap:10px;margin-top:22px}
    input{flex:1;border:0;border-radius:12px;padding:15px 16px;font-size:16px}
    button{border:0;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer;background:#111827;color:#fff}
    button.secondary{background:#fff;color:#111827;border:1px solid #d1d5db;padding:10px 14px}
    .section{margin-top:24px}
    .section h2{font-size:20px;margin:0 0 12px}
    .status{margin:14px 2px;color:#4b5563}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:9px 12px;cursor:pointer;font-size:14px}
    .chip:hover{border-color:#111827}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .card h3{font-size:17px;margin:0 0 12px;line-height:1.3}
    .meta{font-size:13px;color:#6b7280;margin-bottom:12px}
    .price{font-size:22px;font-weight:800;margin:8px 0}
    .muted{color:#9ca3af;font-size:14px}
    a{color:#2563eb;text-decoration:none;font-weight:700}
    .tag{display:inline-block;background:#eef2ff;padding:5px 8px;border-radius:999px;font-size:12px;margin-top:8px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>ML Ofertas Detector</h1>
      <p>Buscador + tendencias reales de Mercado Libre Argentina.</p>
      <div class="search">
        <input id="q" placeholder="Ej: notebook, celular, smart tv..." value="notebook" />
        <button id="btn">Buscar</button>
      </div>
    </section>

    <section class="section">
      <div class="row">
        <h2>Tendencias de Mercado Libre</h2>
        <button class="secondary" id="reloadTrends">Actualizar</button>
      </div>
      <div id="trendStatus" class="status">Cargando tendencias...</div>
      <div id="trends" class="chips"></div>
    </section>

    <section class="section">
      <h2>Resultados</h2>
      <div id="status" class="status">Listo para buscar.</div>
      <div id="results" class="grid"></div>
    </section>
  </div>

  <script>
    const q = document.getElementById('q');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const trends = document.getElementById('trends');
    const trendStatus = document.getElementById('trendStatus');
    const reloadTrends = document.getElementById('reloadTrends');

    function money(value, currency='ARS'){
      if(value === null || value === undefined) return null;
      try{
        return new Intl.NumberFormat('es-AR',{style:'currency',currency,maximumFractionDigits:0}).format(value);
      }catch{
        return value;
      }
    }

    async function loadTrends(){
      trendStatus.textContent = 'Cargando tendencias...';
      trends.innerHTML = '';
      try{
        const r = await fetch('/api/mercadolibre/trends');
        const data = await r.json();
        if(!r.ok || !data.ok){
          throw new Error(data?.details?.message || data?.message || 'Error al cargar tendencias');
        }

        trendStatus.textContent = `${data.count} tendencias semanales disponibles. Tocá una para buscarla.`;
        trends.innerHTML = data.trends.map(t => `
          <button class="chip" data-keyword="${(t.keyword || '').replace(/"/g,'&quot;')}">
            ${t.rank}. ${t.keyword || 'Sin nombre'}
          </button>
        `).join('');

        trends.querySelectorAll('.chip').forEach(el => {
          el.addEventListener('click', () => {
            q.value = el.dataset.keyword;
            search();
          });
        });
      }catch(e){
        trendStatus.textContent = `Error: ${e.message}`;
      }
    }

    async function search(){
      const term = q.value.trim();
      if(!term) return;
      btn.disabled = true;
      status.textContent = `Buscando "${term}" en Mercado Libre...`;
      results.innerHTML = '';

      try{
        const r = await fetch(`/api/mercadolibre/search?q=${encodeURIComponent(term)}&limit=20`);
        const data = await r.json();

        if(!r.ok || !data.ok){
          throw new Error(data?.details?.message || data?.message || 'Error al buscar');
        }

        status.textContent = `${data.count} resultados mostrados para "${data.query}".`;

        results.innerHTML = data.results.map(p => {
          const w = p.buy_box_winner;
          const current = w ? money(w.price, w.currency_id) : null;
          const regular = w ? money(w.original_price, w.currency_id) : null;
          return `
            <article class="card">
              <h3>${p.name || 'Producto sin nombre'}</h3>
              <div class="meta">${p.product_id || ''}</div>
              ${current ? `<div class="price">${current}</div>` : `<div class="muted">Sin precio ganador expuesto por este endpoint</div>`}
              ${regular ? `<div class="muted">Precio original: ${regular}</div>` : ''}
              ${w?.free_shipping ? `<span class="tag">Envío gratis</span>` : ''}
              <div style="margin-top:14px">
                ${p.permalink ? `<a href="${p.permalink}" target="_blank" rel="noopener">Ver en Mercado Libre →</a>` : ''}
              </div>
            </article>
          `;
        }).join('');
      }catch(e){
        status.textContent = `Error: ${e.message}`;
      }finally{
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', search);
    q.addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
    reloadTrends.addEventListener('click', loadTrends);

    loadTrends();
  </script>
</body>
</html>
