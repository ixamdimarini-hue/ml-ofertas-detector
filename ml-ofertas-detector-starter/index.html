<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ML Ofertas Detector</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#111827;background:#f3f5f7}
    *{box-sizing:border-box}
    body{margin:0}
    .wrap{max-width:1180px;margin:0 auto;padding:34px 18px 70px}
    .hero{background:#ffe600;border-radius:24px;padding:30px;box-shadow:0 12px 34px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:36px}
    .hero p{margin:0;color:#374151}
    .search{display:flex;gap:10px;margin-top:24px}
    input{flex:1;border:0;border-radius:14px;padding:16px 17px;font-size:16px;outline:none}
    button{border:0;border-radius:14px;padding:0 22px;font-weight:800;cursor:pointer;background:#111827;color:#fff}
    button:disabled{opacity:.6}
    .status{margin:22px 2px 14px;color:#4b5563}
    .notice{margin-top:18px;background:#fff;padding:14px 16px;border-radius:14px;color:#374151;box-shadow:0 4px 14px rgba(0,0,0,.04)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
    .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 7px 20px rgba(0,0,0,.06);display:flex;flex-direction:column;min-height:330px}
    .thumb{width:100%;height:170px;object-fit:contain;border-radius:12px;background:#fafafa;margin-bottom:12px}
    .card h3{font-size:16px;line-height:1.35;margin:0 0 10px}
    .meta{font-size:12px;color:#6b7280}
    .price{font-size:25px;font-weight:850;margin:12px 0 2px}
    .old{font-size:13px;color:#9ca3af;text-decoration:line-through}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .tag{background:#eef2ff;border-radius:999px;padding:5px 8px;font-size:12px}
    .actions{margin-top:auto;padding-top:18px}
    .meli-link{display:flex;justify-content:center;padding:12px 14px;border-radius:12px;background:#3483fa;color:#fff;text-decoration:none;font-weight:800}
    .muted{color:#9ca3af;font-size:13px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>ML Ofertas Detector</h1>
      <p>Ahora buscamos publicaciones reales del marketplace, no productos inferidos de catálogo.</p>
      <div class="search">
        <input id="q" value="PS5" placeholder="Ej: PS5, iPhone 15, Smart TV Samsung..." />
        <button id="btn">Buscar</button>
      </div>
    </section>

    <div class="notice">
      Los botones usan exclusivamente el <b>permalink real devuelto por Mercado Libre</b>.
      Si una publicación no trae permalink, no la mostramos.
    </div>

    <div id="status" class="status">Listo para buscar.</div>
    <section id="results" class="grid"></section>
  </main>

<script>
const q = document.getElementById('q');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const results = document.getElementById('results');

function safe(v){
  return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
}
function money(v,c='ARS'){
  if(v===null||v===undefined)return null;
  try{return new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:0}).format(v)}
  catch{return String(v)}
}

async function search(){
  const term=q.value.trim();
  if(!term)return;

  btn.disabled=true;
  status.textContent=`Buscando publicaciones activas para "${term}"...`;
  results.innerHTML='';

  try{
    const r=await fetch(`/api/mercadolibre/listings-search?q=${encodeURIComponent(term)}&limit=30`);
    const data=await r.json();

    if(!r.ok || !data.ok){
      throw new Error(data?.details?.message || data?.details?.error || data?.message || `Mercado Libre respondió ${r.status}`);
    }

    status.textContent=`${data.count} publicaciones reales encontradas para "${data.query}".`;

    if(!data.results.length){
      results.innerHTML='<div class="muted">No se encontraron publicaciones con permalink válido.</div>';
      return;
    }

    results.innerHTML=data.results.map(p=>{
      const current=money(p.price,p.currency_id);
      const regular=money(p.original_price,p.currency_id);

      return `
        <article class="card">
          ${p.thumbnail ? `<img class="thumb" src="${safe(p.thumbnail)}" alt="">` : ''}
          <h3>${safe(p.title)}</h3>
          <div class="meta">${safe(p.item_id)}${p.condition ? ` · ${safe(p.condition)}` : ''}</div>
          <div class="price">${safe(current)}</div>
          ${regular && p.original_price !== p.price ? `<div class="old">${safe(regular)}</div>` : ''}
          <div class="tags">
            ${p.free_shipping ? '<span class="tag">Envío gratis</span>' : ''}
            ${p.sold_quantity !== null ? `<span class="tag">${safe(p.sold_quantity)} vendidos</span>` : ''}
          </div>
          <div class="actions">
            <a class="meli-link" href="${safe(p.permalink)}" target="_blank" rel="noopener noreferrer">
              Ver publicación real →
            </a>
          </div>
        </article>
      `;
    }).join('');
  }catch(e){
    status.textContent=`Error: ${e.message}`;
  }finally{
    btn.disabled=false;
  }
}

btn.addEventListener('click',search);
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
</body>
</html>
